name: build and deploy the SootViz page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: build the wheel the browser will install
        run: |
          python -m pip install --quiet build
          python -m build --wheel
          mkdir -p _site
          cp web/index.html web/style.css web/app.js web/worker.js _site/
          # the worker installs this exact name
          cp dist/*.whl _site/sootviz_compute-0.1.0-py3-none-any.whl
          # stamp the build, so a cached wheel from an older build cannot be
          # served against a newer page, and so a user can say which build
          # produced a figure
          BUILD="$(git rev-parse --short HEAD)"
          sed -i "s/__BUILD__/$BUILD/g" _site/worker.js _site/index.html
          echo "built $BUILD"

      - name: run the benchmarks and build the gallery
        run: |
          python -m pip install --quiet -e .
          python -m sootviz.cli benchmark --out _site/benchmarks
          python web/make_gallery.py _site/benchmarks

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
